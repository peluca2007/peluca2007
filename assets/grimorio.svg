<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1310"/><stop offset="1" stop-color="#0e0b09"/></linearGradient>
  <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b91c1c"/><stop offset=".5" stop-color="#f59e0b"/><stop offset="1" stop-color="#b91c1c"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f59e0b" stop-opacity=".22"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .serif{font-family:'Cinzel','Trajan Pro',Georgia,'Times New Roman',serif} .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'Fira Code',Consolas,'Courier New',monospace}
  @keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-140px);opacity:0}}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .ember{animation:rise linear infinite} .pulse{animation:pulse 4s ease-in-out infinite}
  
</style>
<rect x="1" y="1" width="1198" height="378" rx="14" fill="url(#bg)" stroke="#3b2a1e" stroke-width="2"/><rect x="10" y="10" width="1180" height="360" rx="10" fill="none" stroke="#f59e0b" stroke-opacity=".35" stroke-width="1"/><path d="M10 3 L17 10 L10 17 L3 10 Z" fill="#f59e0b"/><path d="M1190 3 L1197 10 L1190 17 L1183 10 Z" fill="#f59e0b"/><path d="M10 363 L17 370 L10 377 L3 370 Z" fill="#f59e0b"/><path d="M1190 363 L1197 370 L1190 377 L1183 370 Z" fill="#f59e0b"/><text x="80" y="62" class="mono" font-size="13" letter-spacing="3" fill="#f59e0b">NA MESA</text><text x="660" y="62" class="mono" font-size="13" letter-spacing="3" fill="#f59e0b">NO CÓDIGO</text><rect x="40" y="92" width="1120" height="64" rx="8" fill="#f59e0b" fill-opacity=".04" stroke="#3b2a1e"/><text x="80" y="119" class="sans" font-size="16.5" fill="#efe3c8">Cada reserva (vida, mana, fôlego) é</text><text x="80" y="141" class="sans" font-size="16.5" fill="#efe3c8">multiplicativa e presa a um atributo</text><path d="M560 124 H612 M600 114 L614 124 L600 134" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="660" y="119" class="sans" font-size="16.5" fill="#fbbf24">Dependências explícitas,</text><text x="660" y="141" class="sans" font-size="16.5" fill="#fbbf24">nada de número mágico</text><rect x="40" y="162" width="1120" height="64" rx="8" fill="#f59e0b" fill-opacity=".04" stroke="#3b2a1e"/><text x="80" y="189" class="sans" font-size="16.5" fill="#efe3c8">Uma escola de magia é fechada primeiro</text><text x="80" y="211" class="sans" font-size="16.5" fill="#efe3c8">e vira o molde de todas as outras</text><path d="M560 194 H612 M600 184 L614 194 L600 204" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="660" y="189" class="sans" font-size="16.5" fill="#fbbf24">Um módulo de referência</text><text x="660" y="211" class="sans" font-size="16.5" fill="#fbbf24">que os outros replicam</text><rect x="40" y="232" width="1120" height="64" rx="8" fill="#f59e0b" fill-opacity=".04" stroke="#3b2a1e"/><text x="80" y="259" class="sans" font-size="16.5" fill="#efe3c8">Toda magia declara efeito, dano,</text><text x="80" y="281" class="sans" font-size="16.5" fill="#efe3c8">ações e custo, sem ambiguidade</text><path d="M560 264 H612 M600 254 L614 264 L600 274" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="660" y="259" class="sans" font-size="16.5" fill="#fbbf24">Contrato claro: entrada,</text><text x="660" y="281" class="sans" font-size="16.5" fill="#fbbf24">saída e efeito colateral</text><rect x="40" y="302" width="1120" height="64" rx="8" fill="#f59e0b" fill-opacity=".04" stroke="#3b2a1e"/><text x="80" y="329" class="sans" font-size="16.5" fill="#efe3c8">Mana escassa e vida que não volta</text><text x="80" y="351" class="sans" font-size="16.5" fill="#efe3c8">dormindo, para a cura ter função</text><path d="M560 334 H612 M600 324 L614 334 L600 344" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="660" y="329" class="sans" font-size="16.5" fill="#fbbf24">Restrições de projeto que dão</text><text x="660" y="351" class="sans" font-size="16.5" fill="#fbbf24">motivo a cada parte existir</text>
</svg>