  <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b91c1c"/><stop offset=".5" stop-color="#f59e0b"/><stop offset="1" stop-color="#b91c1c"/></linearGradient>
