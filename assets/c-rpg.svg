<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1310"/><stop offset="1" stop-color="#0e0b09"/></linearGradient>
  <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b91c1c"/><stop offset=".5" stop-color="#f59e0b"/><stop offset="1" stop-color="#b91c1c"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f59e0b" stop-opacity=".22"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .serif{font-family:'Cinzel','Trajan Pro',Georgia,'Times New Roman',serif} .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'Fira Code',Consolas,'Courier New',monospace}
  @keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-140px);opacity:0}}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .ember{animation:rise linear infinite} .pulse{animation:pulse 4s ease-in-out infinite}
  
</style>
<rect x="1" y="1" width="598" height="228" rx="12" fill="url(#bg)" stroke="#3b2a1e" stroke-width="2"/><rect x="8" y="8" width="584" height="214" rx="8" fill="none" stroke="#f59e0b" stroke-opacity=".35" stroke-width="1"/><path d="M8 1 L15 8 L8 15 L1 8 Z" fill="#f59e0b"/><path d="M592 1 L599 8 L592 15 L585 8 Z" fill="#f59e0b"/><path d="M8 215 L15 222 L8 229 L1 222 Z" fill="#f59e0b"/><path d="M592 215 L599 222 L592 229 L585 222 Z" fill="#f59e0b"/><rect x="22" y="22" width="170" height="22" rx="4" fill="#b91c1c" fill-opacity=".85"/><text x="107" y="37" text-anchor="middle" class="mono" font-size="11" letter-spacing="1.5" fill="#efe3c8">CAMPANHA PRINCIPAL</text><text x="24" y="82" class="serif" font-size="26" font-weight="700" fill="#efe3c8">Moshoku Tensei RPG</text><text x="24" y="114" class="sans" font-size="15.5" fill="#a8977a">Sistema autoral de RPG de mesa em português,</text><text x="24" y="136" class="sans" font-size="15.5" fill="#a8977a">com livro de regras e site que roda offline.</text><rect x="24" y="170" width="97" height="27" rx="13.5" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-opacity=".55"/><text x="73" y="186" text-anchor="middle" class="mono" font-size="13" fill="#efe3c8">TypeScript</text><rect x="128" y="170" width="75" height="27" rx="13.5" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-opacity=".55"/><text x="166" y="186" text-anchor="middle" class="mono" font-size="13" fill="#efe3c8">Next.js</text><rect x="210" y="170" width="45" height="27" rx="13.5" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-opacity=".55"/><text x="232" y="186" text-anchor="middle" class="mono" font-size="13" fill="#efe3c8">PWA</text><g stroke="#f59e0b" stroke-width="2" fill="none"><path d="M500 50 Q520 42 538 50 L538 100 Q520 92 500 100 Z" fill="#f59e0b" fill-opacity=".1"/><path d="M538 50 Q556 42 576 50 L576 100 Q556 92 538 100 Z" fill="#f59e0b" fill-opacity=".1"/></g>
</svg>